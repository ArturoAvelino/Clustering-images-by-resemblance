# Example configuration for rerunning UMAP + HDBSCAN without recomputing embeddings.
# This YAML is the source of truth for configuration.
# Keys map 1:1 to the pipeline configuration fields.

# Tell the pipeline to skip DINOv2 embedding and reuse cached files.
compute: "only-dimreduction-and-clustering"

# Directory containing embeddings.dat, embeddings.json, sizes.npy, and images.txt
# from a previous run of the pipeline.
dino_files: "/path/to/output"

# Optional: select only these exact entries from the ORIGINAL full "images.txt" file.
# Never replace the source "images.txt" with a subset list.
# subset_images: "/path/to/subset_images.txt"

# Directory where the new outputs (umap.npy, clusters.csv, images.txt) will be written.
output_dir: "/path/to/output/umap_hdbscan_only"

# Weight applied to the cached size feature in UMAP.
# 0.0 keeps the feature out of UMAP; use a previously chosen positive weight
# only if image size is intentionally meant to affect neighborhoods.
size_feature_weight: 0.0

# Target dimensionality-reduction from UMAP.
umap_dim: 30

# Number of nearest neighbors used by UMAP.
umap_neighbors: 30

# UMAP minimum distance between points.
umap_min_dist: 0.0

# UMAP distance metric.
umap_metric: "cosine"

# Large-dataset mode: fit UMAP on a deterministic sample, then transform all
# cached embeddings in batches. A smaller sample and batch reduce peak RAM.
umap_fit_sample_size: 250000
umap_transform_batch_size: 25000

# Minimum cluster size for HDBSCAN (smaller values produce more clusters).
hdbscan_min_cluster_size: 500

# HDBSCAN minimum samples (higher values produce more conservative clusters).
hdb_min_samples: 50

# HDBSCAN distance metric.
hdb_metric: "euclidean"

# HDBSCAN cluster-selection behavior.
hdb_cluster_selection_method: "eom"
hdb_cluster_selection_epsilon: 0.0
hdb_allow_single_cluster: false

# Fit HDBSCAN on a sample of UMAP rows, then assign every row in batches with
# approximate_predict. Assignments cover all rows but are sample-fitted.
hdbscan_fit_sample_size: 250000
hdbscan_predict_batch_size: 25000
hdbscan_core_dist_n_jobs: 1

# Keep the 15-million-row CSV smaller; vectors remain available in umap.npy.
write_dimreduction_vector: false

# Write richness.csv after clusters.csv is created.
write_richness_file: false

# Disable automatic per-cluster UMAP/HDBSCAN jobs for the first full-scale run.
subclustering: false
min_for_subclustering: 1000
subclustering_umap_dim: 60
subclustering_umap_neighbors: 30
subclustering_hdbscan_min_cluster_size: 7
subclustering_hdb_min_samples: 6
subclustering_hdb_cluster_selection_method:
subclustering_hdb_cluster_selection_epsilon:
subclustering_hdb_allow_single_cluster:

# If true, non-noise subclusters created from parent cluster -1 are remapped
# into new top-level cluster IDs in clusters.csv.
merge_noise_subclusters: false

# These refinement settings are accepted in every config file so the same schema
# can be reused across run modes. They only affect full runs with two_pass: true.
refine_prob_threshold: 0.7
refine_include_noise: true
