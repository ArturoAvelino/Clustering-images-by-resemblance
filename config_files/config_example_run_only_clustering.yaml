# Example configuration for rerunning HDBSCAN without recomputing embeddings or UMAP.
# This YAML is the source of truth for configuration.
# Keys map 1:1 to the pipeline configuration fields.

# Tell the pipeline to skip DINOv2 embedding and UMAP, reusing cached UMAP outputs.
compute: "only-clustering"

# Directory containing umap.npy and images.txt from a previous run of the pipeline.
umap_files: "/path/to/output"

# Target dimensionality for UMAP reduction. It must match the dimensionality of
# the UMAP vectors.
umap_dim: 60

# Directory where the new outputs (clusters.csv, images.txt) will be written.
output_dir: "/path/to/output/hdbscan_only"

# Minimum cluster size for HDBSCAN (smaller values produce more clusters).
hdbscan_min_cluster_size: 25

# HDBSCAN minimum samples (higher values produce more conservative clusters).
hdb_min_samples: 10

# HDBSCAN distance metric.
hdb_metric: "euclidean"

# HDBSCAN cluster-selection behavior.
hdb_cluster_selection_method: "eom"
hdb_cluster_selection_epsilon: 0.0
hdb_allow_single_cluster: false

# Weight applied to the size feature when clustering.
# 0.0 disables the size feature; higher values make size more influential.
size_feature_weight: 0.0

# Write the UMAP vector to the dim_reduction column in clusters.csv.
write_dimreduction_vector: true

# Automatic subclustering can run in this mode only when dino_files points to
# cached DINOv2 artifacts for the same images.
subclustering: true
min_for_subclustering: 1000
subclustering_umap_dim: 60
subclustering_umap_neighbors: 30
subclustering_hdbscan_min_cluster_size: 7
subclustering_hdb_min_samples: 6
subclustering_hdb_cluster_selection_method:
subclustering_hdb_cluster_selection_epsilon:
subclustering_hdb_allow_single_cluster:

# If true, non-noise subclusters created from parent cluster -1 are remapped
# into new top-level cluster IDs in clusters.csv.
merge_noise_subclusters: false

# These refinement settings are accepted in every config file so the same schema
# can be reused across run modes. They only affect full runs with two_pass: true.
refine_prob_threshold: 0.7
refine_include_noise: true
